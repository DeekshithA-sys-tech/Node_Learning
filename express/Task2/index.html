<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post" action="/stdData">
        <input type="text" placeholder="first name" name="fname" required>
        <input type="text" placeholder="last name" name="lname" required>
        <input type="email" placeholder="email" name="email" required>
        <input type="text" placeholder="college" name="college" required>
        <input type="text" placeholder="course" name="course" required>
        <input type="date" name="dob" required>
        <input type="number" placeholder="percentage" name="percentage" required>
        <button>Submit</button>
    </form>
    <p><a href="/display">View all saved records</a></p>
</body>
</html>
