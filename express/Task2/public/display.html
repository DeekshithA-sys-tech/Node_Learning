<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Students</title>

    <style>

        table{
            width:100%;
            border-collapse: collapse;
        }

        th,td{
            border:1px solid black;
            padding:10px;
        }

    </style>
</head>
<body>

    <h1>Student Records</h1>

    <table>

        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>College</th>
                <th>Course</th>
                <th>DOB</th>
                <th>Percentage</th>
            </tr>
        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>


    <script>

        const fetchStudents = async () => {

            const response = await fetch('http://localhost:5000/display')

            const data = await response.json()

            console.log(data)

            const tableBody = document.getElementById('tableBody')

            data.map((student) => {

                tableBody.innerHTML += `

                    <tr>
                        <td>${student.fname}</td>
                        <td>${student.lname}</td>
                        <td>${student.email}</td>
                        <td>${student.college}</td>
                        <td>${student.course}</td>
                        <td>${student.dob}</td>
                        <td>${student.percentage}</td>
                    </tr>

                `
            })
        }

        fetchStudents()

    </script>

</body>
</html>
